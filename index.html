<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEA NEWS - Escolha a Área</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="choice-screen" class="screen">
    <button id="theme-toggle-choice" class="btn btn-icon theme-toggle-top">🌙</button>
    
    <div class="choice-container">
      <img src="https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=800" alt="Escola" class="school-photo-large">
      <h1>LEA NEWS</h1>
      <p class="school-name-login">E.E. Prof. Lea de Freitas Monteiro</p>
      <p class="choice-subtitle">Escolha a área que deseja acessar</p>
      
      <div class="choice-cards">
        <div class="choice-card" id="btn-comunidade">
          <div class="choice-icon">👨‍🎓</div>
          <h2>Área da Comunidade</h2>
          <p>Alunos, Pais e Professores</p>
          <button class="btn btn-primary">Entrar</button>
        </div>
        
        <div class="choice-card gestão" id="btn-gestao">
          <div class="choice-icon">⚙️</div>
          <h2>Área de Gestão</h2>
          <p>Grêmio, Direção e Coordenação</p>
          <button class="btn btn-dark">Entrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tema
    const themeBtn = document.getElementById('theme-toggle-choice');
    const html = document.documentElement;
    
    // Carrega tema salvo
    if (localStorage.getItem('theme') === 'dark') {
      html.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }

    themeBtn.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.textContent = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });

    // Navegação
    document.getElementById('btn-comunidade').addEventListener('click', () => {
      window.location.href = 'login.html';
    });

    document.getElementById('btn-gestao').addEventListener('click', () => {
      window.location.href = 'gestao-login.html';
    });
  </script>
</body>
</html>
