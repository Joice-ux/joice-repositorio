<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEA NEWS - Entrar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <button id="theme-toggle-login" class="btn btn-icon theme-toggle-top" type="button">🌙</button>
    <div class="login-card">
      <button class="btn-back" type="button" onclick="location.href='index.html'">← Voltar ao jornal</button>
      <div class="logo-mark big">📰</div>
      <h1>Área da Comunidade</h1>
      <p class="school-name-login">Alunos (RA) e responsáveis (CPF)</p>
      <p class="school-name-login" style="margin-top:-14px;font-size:13px;">E.E. Prof. Lea de Freitas Monteiro</p>
      <div id="login-erro" class="login-erro"></div>
      <form id="login-form" class="auth-form">
        <input type="text" id="identificador" placeholder="RA (aluno) ou CPF (responsável)" required autocomplete="username">
        <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
        <button type="submit" id="login-submit" class="btn btn-primary">Entrar</button>
      </form>
      <p class="login-hint">
        Leia o jornal sem login.<br>
        Entre só para <strong>curtir</strong> e <strong>comentar</strong>.<br>
        Cadastro só pela escola.<br>
        Gestão: <a href="login-gestao.html">Área Restrita</a>
      </p>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    var themeBtn = document.getElementById('theme-toggle-login');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      themeBtn.textContent = dark ? '🌙' : '☀️';
      localStorage.setItem('theme', dark ? 'light' : 'dark');
    });

    function mostrarErro(msg) {
      var el = document.getElementById('login-erro');
      el.classList.add('show');
      el.textContent = msg;
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('login-submit');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      apiFetch('/api/login', {
        method: 'POST',
        body: {
          identificador: document.getElementById('identificador').value.trim(),
          senha: document.getElementById('password').value
        }
      }).then(function (r) {
        salvarSessao(r.token, r.user);
        window.location.href = 'index.html';
      }).catch(function (err) {
        mostrarErro(err.message);
        btn.disabled = false;
        btn.textContent = 'Entrar';
      });
    });
  </script>
</body>
</html>
