<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEA NEWS - Área Restrita</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <button id="theme-toggle-login" class="btn btn-icon theme-toggle-top" type="button">🌙</button>
    <div class="login-card">
      <button class="btn-back" type="button" onclick="location.href='index.html'">← Voltar ao jornal</button>
      <span class="login-badge">Área Restrita</span>
      <div class="logo-mark big">📰</div>
      <h1>Área de Gestão</h1>
      <p class="school-name-login">Grêmio, Direção e Coordenação</p>
      <div id="login-erro" class="login-erro"></div>
      <form id="login-form" class="auth-form">
        <input type="text" id="username" placeholder="Usuário" required autocomplete="username">
        <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
        <button type="submit" id="login-submit" class="btn btn-primary">Entrar</button>
      </form>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    var themeBtn = document.getElementById('theme-toggle-login');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      themeBtn.textContent = dark ? '🌙' : '☀️';
      localStorage.setItem('theme', dark ? 'light' : 'dark');
    });

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var erro = document.getElementById('login-erro');
      var btn = document.getElementById('login-submit');
      erro.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      apiFetch('/api/login-gestao', {
        method: 'POST',
        body: {
          username: document.getElementById('username').value.trim(),
          senha: document.getElementById('password').value
        }
      }).then(function (r) {
        salvarSessao(r.token, r.user);
        window.location.href = 'index.html';
      }).catch(function (err) {
        erro.classList.add('show');
        erro.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Entrar';
      });
    });
  </script>
</body>
</html>
